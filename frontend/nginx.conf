server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same headers as the Render static site; connect-src names the compose API.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # the SPA owns its routes, so unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
