name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same database engine as production. The test runner creates and drops
    # test_medidesk itself, so the user needs no more than the default rights.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medidesk
          POSTGRES_USER: medidesk
          POSTGRES_PASSWORD: medidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medidesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://medidesk:medidesk@localhost:5432/medidesk
      # Tests provoke many 4xx replies on purpose; keep their warnings out of the CI log.
      LOG_LEVEL: ERROR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # Generated per run so no key lives in the repo. It also has to be long and
      # random enough to pass the deployment check below (security.W009).
      - name: Generate a throwaway SECRET_KEY
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check hms/

      - name: Check for missing migrations
        working-directory: hms
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        working-directory: hms
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        working-directory: hms
        # The test client speaks plain HTTP. With the redirect on, every request
        # gets a 301 before it reaches a view.
        env:
          SECURE_SSL_REDIRECT: "False"
        run: python manage.py test backend --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
