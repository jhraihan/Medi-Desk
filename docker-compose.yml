services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      dockerfile: hms/Dockerfile
    environment:
      # No fallback: a known key lets anyone forge admin tokens. Put SECRET_KEY in a .env
      # file next to this one. Generate a value with:
      #   python -c "import secrets; print(secrets.token_urlsafe(50))"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      # The stack serves plain HTTP on localhost.
      SECURE_SSL_REDIRECT: "False"
      CACHE_URL: dbcache://hms_cache
      DATABASE_URL: postgres://hms:hms@db:5432/hms
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate && python manage.py createcachetable &&
             gunicorn hms.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1/
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
